name: Remotion Cloud Render

on:
  workflow_dispatch:
    inputs:
      composition:
        description: "Composition ID (MainVideo, VerticalVideo, SquareVideo, PreviewVideo)"
        required: true
        default: "VerticalVideo"
        type: choice
        options:
          - MainVideo
          - VerticalVideo
          - SquareVideo
          - PreviewVideo
      duration:
        description: "Duration in seconds"
        required: false
        default: "15"
        type: string
      platform:
        description: "Target platform"
        required: false
        default: "tiktok"
        type: choice
        options:
          - tiktok
          - reels
          - shorts
          - youtube
          - instagram
          - preview

jobs:
  render:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    defaults:
      run:
        working-directory: ${{ github.workspace }}
        shell: bash
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: DEBUG - Environment info
        run: |
          set -euo pipefail
          echo "=== RUNNER INFO ==="
          uname -a
          echo "=== ENV ==="
          env | grep -E '^(RUNNER|GITHUB|HOME|PATH)' | sort
          echo "=== WORKSPACE ==="
          pwd
          ls -la

      - name: Install Node.js 22 manually (bypass setup-node issues)
        run: |
          set -euo pipefail
          echo "=== INSTALLING NODE 22 VIA NODESOURCE ==="
          curl -fsSL https://deb.nodesource.com/setup_22.x | sudo -E bash -
          sudo apt-get install -y nodejs
          echo "=== NODE VERSION ==="
          node --version
          echo "=== NPM VERSION ==="
          npm --version

      - name: DEBUG - Verify package files
        run: |
          set -euo pipefail
          echo "=== PACKAGE.JSON ==="
          cat package.json
          echo "=== PACKAGE-LOCK.JSON EXISTS ==="
          ls -la package-lock.json

      - name: Install dependencies (no cache, legacy peer deps)
        run: |
          set -euo pipefail
          echo "=== INSTALLING DEPS ==="
          npm install --legacy-peer-deps --no-audit --no-fund 2>&1 | tail -50

      - name: DEBUG - Verify node_modules
        run: |
          set -euo pipefail
          echo "=== NODE_MODULES.BIN ==="
          ls -la node_modules/.bin/ | head -30
          which npx
          npx --version
          echo "=== REMotion CLI ==="
          npx remotion --version

      - name: Install Chromium dependencies (headless)
        run: |
          set -euo pipefail
          echo "=== INSTALLING CHROMIUM DEPS ==="
          sudo apt-get update
          sudo apt-get install -y \
            libnspr4 libnss3 libdrm2 libxkbcommon0 libxcomposite1 \
            libxdamage1 libxrandr2 libgbm1 libxss1 libasound2 \
            libatk1.0-0 libc6 libcairo2 libcups2 libdbus-1-3 \
            libexpat1 libfontconfig1 libgcc1 libglib2.0-0 libgtk-3-0 \
            libnspr4 libpango-1.0-0 libpangocairo-1.0-0 libstdc++6 \
            libx11-6 libx11-xcb1 libxcb1 libxcomposite1 libxcursor1 \
            libxdamage1 libxext6 libxfixes3 libxi6 libxrandr2 libxrender1 \
            libxss1 libxtst6 ca-certificates fonts-liberation libappindicator1 \
            lsb-release xdg-utils wget

      - name: TypeScript compile check
        run: |
          set -euo pipefail
          echo "=== TYPESCRIPT CHECK ==="
          npx tsc --noEmit 2>&1 | tail -30

      - name: DEBUG - Verify source & compositions
        run: |
          set -euo pipefail
          echo "=== ROOT.TSX ==="
          ls -la src/Root.tsx
          echo "=== COMPOSITIONS ==="
          npx remotion compositions src/Root.tsx

      - name: Render video
        id: render
        env:
          COMPOSITION: ${{ github.event.inputs.composition }}
        run: |
          set -euo pipefail
          echo "=== RENDERING: $COMPOSITION ==="
          echo "Start: $(date)"
          npx remotion render src/Root.tsx $COMPOSITION out/video.mp4 \
            --concurrency=4 \
            --quality=80 \
            --log-level=info 2>&1
          echo "End: $(date)"

      - name: DEBUG - Verify video output
        run: |
          set -euo pipefail
          echo "=== OUTPUT ==="
          ls -la out/
          file out/video.mp4
          ls -lh out/video.mp4

      - name: Upload video artifact
        uses: actions/upload-artifact@v4
        with:
          name: rendered-video-${{ github.event.inputs.composition }}-${{ github.run_number }}
          path: out/video.mp4
          retention-days: 7

      - name: Print summary
        if: success()
        run: |
          set -euo pipefail
          echo "✅ RENDER COMPLETATO!"
          echo "Composition: ${{ github.event.inputs.composition }}"
          echo "Duration: ${{ github.event.inputs.duration }}s"
          echo "Platform: ${{ github.event.inputs.platform }}"
          echo "Download: Actions → Artifacts → rendered-video-${{ github.event.inputs.composition }}-${{ github.run_number }}"

      - name: Print failure info
        if: failure()
        run: |
          set -euo pipefail
          echo "❌ RENDER FALLITO"
          echo "Exit code: ${{ job.status }}"
          echo "Check step logs above for exact error"