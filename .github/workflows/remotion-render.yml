name: Remotion Cloud Render

on:
  workflow_dispatch:
    inputs:
      composition:
        description: "Composition ID (MainVideo, VerticalVideo, SquareVideo, PreviewVideo)"
        required: true
        default: "VerticalVideo"
        type: choice
        options:
          - MainVideo
          - VerticalVideo
          - SquareVideo
          - PreviewVideo
      duration:
        description: "Duration in seconds"
        required: false
        default: "15"
        type: string
      platform:
        description: "Target platform"
        required: false
        default: "tiktok"
        type: choice
        options:
          - tiktok
          - reels
          - shorts
          - youtube
          - instagram
          - preview

jobs:
  render:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    defaults:
      run:
        working-directory: ${{ github.workspace }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Debug - Show workspace structure
        run: |
          pwd
          ls -la
          cat package.json | head -30

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Debug - Node and npm versions
        run: |
          node --version
          npm --version
          npm list --depth=0

      - name: Install dependencies
        run: |
          npm install --legacy-peer-deps 2>&1 | tail -20

      - name: Debug - Verify node_modules
        run: |
          ls -la node_modules/.bin/ | head -20
          which npx

      - name: Install Chromium dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libnspr4 libnss3 libdrm2 libxkbcommon0 libxcomposite1 \
            libxdamage1 libxrandr2 libgbm1 libxss1 libasound2 \
            libatk1.0-0 libc6 libcairo2 libcups2 libdbus-1-3 \
            libexpat1 libfontconfig1 libgcc1 libglib2.0-0 libgtk-3-0 \
            libnspr4 libpango-1.0-0 libpangocairo-1.0-0 libstdc++6 \
            libx11-6 libx11-xcb1 libxcb1 libxcomposite1 libxcursor1 \
            libxdamage1 libxext6 libxfixes3 libxi6 libxrandr2 libxrender1 \
            libxss1 libxtst6 ca-certificates fonts-liberation libappindicator1 \
            lsb-release xdg-utils wget

      - name: Build Remotion project
        run: |
          npm run build 2>&1 | tail -30

      - name: Debug - Verify build output
        run: |
          ls -la dist/
          ls -la src/
          npx remotion compositions src/Root.tsx

      - name: Render video
        id: render
        env:
          COMPOSITION: ${{ github.event.inputs.composition }}
        run: |
          echo "Rendering composition: $COMPOSITION"
          npx remotion render src/Root.tsx $COMPOSITION out/video.mp4 \
            --concurrency=4 \
            --quality=80 \
            --log-level=info 2>&1

      - name: Debug - Verify video output
        run: |
          ls -la out/
          file out/video.mp4

      - name: Upload video artifact
        uses: actions/upload-artifact@v4
        with:
          name: rendered-video-${{ github.event.inputs.composition }}-${{ github.run_number }}
          path: out/video.mp4
          retention-days: 7

      - name: Print summary
        if: success()
        run: |
          echo "✅ Render completato!"
          echo "📁 Composition: ${{ github.event.inputs.composition }}"
          echo "⏱️  Duration: ${{ github.event.inputs.duration }}s"
          echo "📱 Platform: ${{ github.event.inputs.platform }}"
          echo "📥 Scarica da: Actions → Artifacts → rendered-video-${{ github.event.inputs.composition }}-${{ github.run_number }}"

      - name: Print failure info
        if: failure()
        run: |
          echo "❌ Render fallito"
          echo "Controlla i log sopra per l'errore"
          echo "Exit code: ${{ job.status }}"