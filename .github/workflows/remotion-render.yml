name: Remotion Cloud Render

on:
  workflow_dispatch:
    inputs:
      composition:
        description: "Composition ID to render (start with verification-video to verify pipeline)"
        required: true
        default: "verification-video"
        type: choice
        options:
          - verification-video
          - verification-video-square
          - verification-video-landscape
          - test-video
          - test-video-square
          - test-video-landscape
          - hholmes-video
          - hholmes-preview
      duration:
        description: "Duration in seconds (for test-video compositions)"
        required: false
        default: "3"
        type: string
      platform:
        description: "Target platform (informational)"
        required: false
        default: "tiktok"
        type: choice
        options:
          - tiktok
          - reels
          - shorts
          - youtube
          - instagram
          - preview

jobs:
  render:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    defaults:
      run:
        working-directory: ${{ github.workspace }}
        shell: bash
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: DEBUG - Environment info
        run: |
          set -euo pipefail
          echo "=== RUNNER INFO ==="
          uname -a
          echo "=== ENV ==="
          env | grep -E '^(RUNNER|GITHUB|HOME|PATH)' | sort
          echo "=== WORKSPACE ==="
          pwd
          ls -la

      - name: Install Node.js 22 manually (bypass setup-node issues)
        run: |
          set -euo pipefail
          echo "=== INSTALLING NODE 22 VIA NODESOURCE ==="
          curl -fsSL https://deb.nodesource.com/setup_22.x | sudo -E bash -
          sudo apt-get install -y nodejs
          echo "=== NODE VERSION ==="
          node --version
          echo "=== NPM VERSION ==="
          npm --version

      - name: DEBUG - Verify package files
        run: |
          set -euo pipefail
          echo "=== PACKAGE.JSON ==="
          cat package.json
          echo "=== PACKAGE-LOCK.JSON EXISTS ==="
          ls -la package-lock.json

      - name: Install dependencies (no cache, legacy peer deps)
        run: |
          set -euo pipefail
          echo "=== INSTALLING DEPS ==="
          npm install --legacy-peer-deps --no-audit --no-fund 2>&1
          echo "=== DEPS INSTALLED ==="

      - name: DEBUG - Verify node_modules
        run: |
          set -euo pipefail
          echo "=== NODE_MODULES.BIN ==="
          ls -la node_modules/.bin/ | head -30
          which npx
          npx --version
          echo "=== REMotion CLI ==="
          npx remotion --version 2>&1 || true

      - name: Install Chromium dependencies + Xvfb (Ubuntu 22.04 compatible)
        run: |
          set -euo pipefail
          echo "=== INSTALLING CHROMIUM DEPS + XVFB (Ubuntu 22.04) ==="
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends \
            xvfb \
            libnspr4 libnss3 libdrm2 libxkbcommon0 libxcomposite1 \
            libxdamage1 libxrandr2 libgbm1 libxss1 libasound2 \
            libatk1.0-0 libc6 libcairo2 libcups2 libdbus-1-3 \
            libexpat1 libfontconfig1 libgcc1 libglib2.0-0 libgtk-3-0 \
            libnspr4 libpango-1.0-0 libpangocairo-1.0-0 libstdc++6 \
            libx11-6 libx11-xcb1 libxcb1 libxcomposite1 libxcursor1 \
            libxdamage1 libxext6 libxfixes3 libxi6 libxrandr2 libxrender1 \
            libxss1 libxtst6 ca-certificates fonts-liberation \
            libappindicator3-1 lsb-release xdg-utils wget \
            chromium-browser 2>&1 | tail -20
          echo "=== CHROMIUM DEPS + XVFB DONE ==="

      - name: TypeScript compile check (non-blocking)
        run: |
          set +e
          echo "=== TYPESCRIPT CHECK ==="
          npx tsc --noEmit 2>&1
          TS_EXIT=$?
          if [ $TS_EXIT -eq 0 ]; then
            echo "TypeScript: OK"
          else
            echo "TypeScript: WARNINGS/ERRORS (exit code: $TS_EXIT) - continuing anyway"
          fi
          echo "=== TYPESCRIPT CHECK DONE ==="

      - name: DEBUG - Verify source & compositions
        run: |
          set -euo pipefail
          echo "=== ROOT.TSX ==="
          ls -la src/Root.tsx
          echo "=== COMPOSITIONS ==="
          npx remotion compositions src/Root.tsx 2>&1
          echo "=== COMPOSITIONS LISTED ==="

      - name: Ensure output directory exists
        run: |
          set -euo pipefail
          mkdir -p out
          echo "=== OUTPUT DIR READY ==="
          ls -la out/

      - name: Render video
        id: render
        env:
          COMPOSITION: ${{ github.event.inputs.composition }}
        run: |
          set -euo pipefail
          echo "=== RENDERING: $COMPOSITION ==="
          echo "Start: $(date)"

          # Set render params based on composition
          if [[ "$COMPOSITION" == "verification-video" ]] || [[ "$COMPOSITION" == "verification-video-square" ]] || [[ "$COMPOSITION" == "verification-video-landscape" ]]; then
            CONCURRENCY=4
            QUALITY=80
          elif [[ "$COMPOSITION" == "test-video" ]] || [[ "$COMPOSITION" == "test-video-square" ]] || [[ "$COMPOSITION" == "test-video-landscape" ]]; then
            CONCURRENCY=2
            QUALITY=70
          elif [[ "$COMPOSITION" == "hholmes-video" ]] || [[ "$COMPOSITION" == "hholmes-preview" ]]; then
            CONCURRENCY=1
            QUALITY=60
          else
            CONCURRENCY=1
            QUALITY=60
          fi

          echo "Concurrency: $CONCURRENCY, Quality: $QUALITY"
          echo "Free memory: $(free -h | grep Mem | awk '{print $7}')"

          # Render with Xvfb + GPU flags + explicit error capture
          xvfb-run -a -s "-screen 0 1920x1080x24" \
            npx remotion render src/Root.tsx $COMPOSITION out/video.mp4 \
              --concurrency=$CONCURRENCY \
              --quality=$QUALITY \
              --timeout=300000 \
              --log-level=verbose \
              --chromium-options="--enable-gpu --use-gl=angle --use-angle=swiftshader --no-sandbox --disable-setuid-sandbox --disable-dev-shm-usage --disable-gpu-sandbox" \
              2>&1 | tee render.log
          RENDER_EXIT=${PIPESTATUS[0]}
          echo "End: $(date)"

          if [ $RENDER_EXIT -ne 0 ]; then
            echo "=== RENDER FAILED (exit $RENDER_EXIT) ==="
            echo "Last 100 lines of render.log:"
            tail -100 render.log
            exit $RENDER_EXIT
          fi

          echo "=== RENDER SUCCEEDED ==="

      - name: DEBUG - Verify video output
        run: |
          set -euo pipefail
          echo "=== OUTPUT ==="
          ls -la out/
          file out/video.mp4
          ls -lh out/video.mp4

      - name: Upload video artifact
        uses: actions/upload-artifact@v4
        with:
          name: rendered-video-${{ github.event.inputs.composition }}-${{ github.run_number }}
          path: out/video.mp4
          retention-days: 7

      - name: Print summary
        if: success()
        run: |
          set -euo pipefail
          echo "✅ RENDER COMPLETATO!"
          echo "Composition: ${{ github.event.inputs.composition }}"
          echo "Duration: ${{ github.event.inputs.duration }}s"
          echo "Platform: ${{ github.event.inputs.platform }}"
          echo "Artifact: rendered-video-${{ github.event.inputs.composition }}-${{ github.run_number }}"
          echo "Download from: Actions → Artifacts"

      - name: Print failure info
        if: failure()
        run: |
          set -euo pipefail
          echo "❌ RENDER FALLITO"
          echo "Exit code: ${{ job.status }}"
          echo "Check step logs above for exact error"